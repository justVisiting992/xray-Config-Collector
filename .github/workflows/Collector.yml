name: Xray Config Collector

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: pip install telethon requests

      - name: Run Python Collector
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        continue-on-error: true
        run: python collector.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Initialize Go Dependencies
        run: |
          go mod tidy || echo "No mod file yet"
          go mod download || echo "Nothing to download"

      - name: Download GeoIP Database
        run: wget -O Country.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

      - name: Run Go Processor
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        # main.go generates the raw text file (e.g., mixed_iran.txt)
        run: go run main.go

      - name: Live Test and Relabel by Exit IP
        run: |
          curl -sL https://go.dev/dl/go1.25.5.linux-amd64.tar.gz -o /tmp/go.tgz
          tar -C /tmp -xzf /tmp/go.tgz
          /tmp/go/bin/go build -C livetest -o /tmp/livetest-bin ./cmd/livetest
          bash livetest/filter-lists.sh /tmp/livetest-bin

      # --- CUSTOM CONVERTER ---
      - name: Convert Links to Clash YAML
        # Ensure converter.go uses the same filename main.go generated
        run: go run converter.go

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Commit this run's output first, then rebase that commit
          # onto whatever main is now and push, retrying the whole
          # fetch/rebase/push cycle a few times. The old sequence
          # (stash, an unguarded git pull --rebase, stash pop, one
          # unguarded git push) failed the entire run whenever a
          # single git command hiccuped.
          git add .
          git commit -m "Update configs $(date +'%Y-%m-%d %H:%M')" || exit 0
          for attempt in 1 2 3 4 5; do
            if ! git fetch origin main; then
              echo "Fetch failed (attempt $attempt); retrying"
              sleep 5
              continue
            fi
            if ! git rebase origin/main; then
              # Conflicting hunks are regenerated files on both
              # sides; this run's fresh versions win.
              git checkout --theirs -- . || true
              git add .
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; fetching and retrying"
            sleep 5
          done
          echo "Could not push after 5 attempts"
          exit 1
