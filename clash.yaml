# xray-Config-Collector — Mihomo (Clash.Meta) subscription
# Proxies live in clash-proxies.yaml (see proxy-providers below); only
# that file changes between runs. This config is static.
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geoip.dat"
  geosite: "https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geosite.dat"
  mmdb: "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/geoip.metadb"
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 78.157.42.100
    - 185.51.200.2
  nameserver:
    - "https://dns.google/dns-query"
    - "https://cloudflare-dns.com/dns-query"
  nameserver-policy:
    "geosite:ir":
      - 78.157.42.100
      - 185.51.200.2
proxy-providers:
  collector:
    type: http
    url: "https://raw.githubusercontent.com/justVisiting992/xray-Config-Collector/main/clash-proxies.yaml"
    path: ./clash-proxies.yaml
    interval: 7200
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
proxy-groups:
  - name: "🚀 PROXY"
    type: select
    proxies:
      - "♻️ AUTO"
      - "🇺🇸 USA"
      - "🇳🇱 Netherlands"
      - "🇩🇪 Germany"
      - "🇯🇵 Japan"
      - "🇫🇷 France"
      - "🇨🇦 Canada"
      - "🇷🇺 Russia"
      - "🇮🇱 Israel"
      - "🇸🇬 Singapore"
      - "🇪🇸 Spain"
      - "🇬🇧 UK"
      - "🇨🇭 Switzerland"
      - "🇭🇰 Hong Kong"
      - "🇮🇶 Iraq"
      - "🇮🇳 India"
      - "🇦🇪 UAE"
      - "🇫🇮 Finland"
      - "🇨🇿 Czechia"
      - "🇸🇪 Sweden"
      - "🇰🇿 Kazakhstan"
      - "🇵🇱 Poland"
      - "🇸🇨 Seychelles"
      - "🇨🇾 Cyprus"
      - "🇰🇷 South Korea"
      - "🌍 OTHER"
      - DIRECT
  - name: "♻️ AUTO"
    type: url-test
    use:
      - collector
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
  - name: "🇺🇸 USA"
    type: url-test
